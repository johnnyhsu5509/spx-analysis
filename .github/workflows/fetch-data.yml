name: fetch-market-data

on:
  workflow_dispatch:
  schedule:
    # 21:15 UTC 週一到週五 = 美股收盤後（夏令 +75min / 冬令 +15min）= 台北早上 05:15
    - cron: '15 21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: fetch-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -q yfinance pandas

      - name: Fetch daily data (fails loudly if Yahoo blocks)
        run: python3 scripts/fetch_today.py

      - name: Fetch macro layer
        run: python3 scripts/check_es.py

      - name: Copy outputs to tracked data/
        run: |
          mkdir -p data
          cp scripts/today_data.txt data/today_data.txt
          cp scripts/es_check.txt data/es_check.txt
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/fetched_at.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: market snapshot $(date -u +%F) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
